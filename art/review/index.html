<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰港登陆 · 港区演练场</title><link rel="stylesheet" href="port.css"><main><header><div><small>GREYHAVEN　/　FIELD TRIAL 02</small><h1>灰港登陆 <em>港区演练场</em></h1></div><a href="v01.html">查看首轮蓝本 ↗</a></header>
<section class="stage"><div class="battle"><canvas id="map" width="1200" height="675" aria-label="战术地图，点选对象，点击空地移动"></canvas><div id="msg" role="status">载入港区……</div></div>
<aside><small>ASSET INSPECTOR　/　对象检阅</small><select id="object" aria-label="选择地图上的单位或建筑"></select><canvas id="preview" width="280" height="215" aria-label="选中对象的旋转预览"></canvas><div class="pair"><label>检阅角度 <output id="angleOut">0°</output></label><button id="spin">连续转动</button></div><input id="angle" type="range" min="0" max="15" value="2" aria-label="十六向角度"><div class="pair"><label for="team">阵营涂装</label><select id="team"><option>海蓝 · 圆</option><option>砖红 · 菱</option><option>琥珀 · 方</option></select></div><div class="pair"><button id="damage">演示损毁</button><button id="restore">复原对象</button></div><div class="pair"><button id="produce">工厂出车</button><select id="product" aria-label="生产车型"><option value="ifv">步兵战车</option><option value="tank">主战坦克</option></select></div><button id="place">部署同型建筑</button></aside></section>
<footer><span>点选单位 → 点击空地移动　·　右键也可下达移动指令</span><label><input type="checkbox" checked id="labels"> 对象名称</label><button id="reset">重置演练</button></footer></main><script src="port.js"></script></html>
